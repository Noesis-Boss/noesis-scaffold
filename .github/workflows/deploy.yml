name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets deploy-pages mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Static scaffold: ./site is already the built output.
      # For a framework build, insert setup-node + install + build here and
      # point `path` at the build output (dist/, build/, out/, _site/).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
